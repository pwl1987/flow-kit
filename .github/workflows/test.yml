name: flow-kit CI

on:
  push:
    branches: [main, develop, 'release/**', 'feat/**']
    paths:
      - 'flow-kit/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'flow-kit/**'

jobs:
  shellcheck:
    name: ShellCheck 静态分析
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flow-kit
    steps:
      - uses: actions/checkout@v4
      - name: 安装 ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: 运行 ShellCheck
        run: |
          shellcheck scripts/*.sh hooks/*.sh lib/*.sh || true
      - name: 检查 ShellCheck 结果
        run: |
          errors=$(shellcheck scripts/*.sh hooks/*.sh lib/*.sh --severity=error 2>/dev/null | grep -c "^In " || echo 0)
          echo "ShellCheck 错误数: $errors"
          if [ "$errors" -gt 0 ]; then exit 1; fi

  unit-tests:
    name: 单元测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flow-kit
    steps:
      - uses: actions/checkout@v4
      - name: 安装依赖
        run: |
          sudo apt-get update && sudo apt-get install -y jq bc
      - name: 运行 dispatch.sh 单元测试
        run: bash tests/test-dispatch.sh
      - name: 运行 validate-phase.sh 单元测试
        run: bash tests/test-validate.sh

  hooks-tests:
    name: Hooks 集成测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flow-kit
    steps:
      - uses: actions/checkout@v4
      - name: 安装依赖
        run: |
          sudo apt-get update && sudo apt-get install -y jq
      - name: 运行 Hooks 集成测试
        run: bash tests/test-hooks.sh

  e2e-tests:
    name: E2E 集成测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flow-kit
    steps:
      - uses: actions/checkout@v4
      - name: 安装依赖
        run: |
          sudo apt-get update && sudo apt-get install -y jq bc
      - name: 运行 E2E 测试
        run: bash tests/e2e-test-harness.sh

  js-tests:
    name: JavaScript 检测测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flow-kit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: 运行 JS 测试
        run: |
          if [ -f lib/detection/checkpoint.test.js ]; then
            node lib/detection/checkpoint.test.js
          fi
          if [ -f lib/detection/database-type.test.js ]; then
            node lib/detection/database-type.test.js
          fi

  benchmark:
    name: 性能基准测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flow-kit
    steps:
      - uses: actions/checkout@v4
      - name: 安装 hyperfine
        run: |
          sudo apt-get update && sudo apt-get install -y bc time
          if command -v hyperfine >/dev/null 2>&1; then
            echo "hyperfine already installed"
          else
            curl -sL https://github.com/sharkdp/hyperfine/releases/download/v1.18.0/hyperfine_1.18.0_amd64.deb -o /tmp/hyperfine.deb
            sudo dpkg -i /tmp/hyperfine.deb || true
          fi
      - name: 运行性能基准测试
        run: |
          mkdir -p .flow-kit/benchmarks
          bash benchmarks/run-benchmarks.sh || echo "benchmark completed"
      - name: 上传基准测试结果
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: .flow-kit/benchmarks/
          retention-days: 30

  shfmt:
    name: shfmt 格式检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flow-kit
    steps:
      - uses: actions/checkout@v4
      - name: 安装 shfmt
        run: go install mvdan.cc/sh/v3/cmd/shfmt@latest
      - name: 运行 shfmt
        run: |
          if ! command -v shfmt &>/dev/null; then
            echo "shfmt not installed, skipping"
            exit 0
          fi
          shfmt -d scripts/*.sh hooks/*.sh lib/*.sh 2>/dev/null || {
            echo "shfmt found formatting issues"
            shfmt -d scripts/*.sh hooks/*.sh lib/*.sh
            exit 1
          }

  test-macos:
    name: macOS 测试
    runs-on: macos-latest
    defaults:
      run:
        working-directory: flow-kit
    steps:
      - uses: actions/checkout@v4
      - name: 运行单元测试
        run: |
          for f in tests/test-*.sh; do
            bash "$f" || { echo "FAIL: $f"; exit 1; }
          done